<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Token Cost</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif}
#chart{width:1350px;max-width:98vw;height:950px}
</style>
</head>
<body>
<div id="chart"></div>
<script>
const DATA = [
  {s:'AWS',               c:'Cloud',             avg: 578,  tok:  5200},
  {s:'Google Cloud',      c:'Cloud',             avg: 539,  tok:   539},
  {s:'Azure',             c:'Cloud',             avg: 311,  tok: 20500},
  {s:'Salesforce',        c:'CRM',               avg: 489,  tok:  5863},
  {s:'Google Analytics',  c:'Analytics',         avg:1510,  tok: 13591},
  {s:'Redshift',          c:'Database',          avg:1116,  tok:  6694},
  {s:'MongoDB',           c:'Database',          avg: 264,  tok:  4759},
  {s:'BigQuery',          c:'Database',          avg:5486,  tok: 32914},
  {s:'Grep',              c:'Developer Tools',   avg: 741,  tok:   741},
  {s:'Context7',          c:'Developer Tools',   avg: 615,  tok:  1229},
  {s:'Serena',            c:'Developer Tools',   avg: 315,  tok:  9444},
  {s:'Gmail',             c:'Google Workspace',  avg: 826,  tok: 10733},
  {s:'Google Drive',      c:'Google Workspace',  avg: 709,  tok:  5669},
  {s:'Google Calendar',   c:'Google Workspace',  avg:2231,  tok: 17851},
  {s:'Google People API', c:'Google Workspace',  avg: 373,  tok:  1119},
  {s:'Google Chat',       c:'Google Workspace',  avg:1238,  tok:  4951},
  {s:'Microsoft Word',    c:'Microsoft 365',     avg: 179,  tok:   716},
  {s:'Microsoft OneDrive',c:'Microsoft 365',     avg: 181,  tok:  3433},
  {s:'Microsoft SharePoint',c:'Microsoft 365',   avg: 391,  tok: 14065},
  {s:'Microsoft Teams',   c:'Microsoft 365',     avg: 335,  tok: 12065},
  {s:'M365 User',         c:'Microsoft 365',     avg: 252,  tok:  1259},
  {s:'M365 Calendar',     c:'Microsoft 365',     avg: 349,  tok:  5577},
];

const CATS = ['Cloud','CRM','Analytics','Database','Developer Tools','Google Workspace','Microsoft 365'];

const COLORS = {
  'Cloud':             '#2563eb',
  'CRM':               '#db2777',
  'Analytics':         '#7c3aed',
  'Database':          '#059669',
  'Developer Tools':   '#d97706',
  'Google Workspace':  '#0d9488',
  'Microsoft 365':     '#dc2626',
};

// ── Y-position: categories as horizontal bands, Cloud at top ──
const catBase = {};
CATS.forEach((c, i) => { catBase[c] = (CATS.length - 1 - i) * 2.5 + 0.75; });

// ── Size: natural log of avg tokens per tool (diameter mode) ──
const SIZEREF = 0.3;
const sizeFn = d => d.avg ** 0.33;

DATA.forEach(d => {
  const group = DATA.filter(x => x.c === d.c);
  const idx = group.indexOf(d);
  const spread = group.length > 1 ? (idx / (group.length - 1) - 0.5) * 0.8 : 0;
  d.y = catBase[d.c] + spread;
  d.sz = sizeFn(d);
});

// ── Collision-aware label positioning (top → bottom → right → left) ──
const FONT_SZ = 12;
const LINE_GAP = 2;
const TEXT_H = FONT_SZ * 2 + LINE_GAP;
const CW = FONT_SZ * 0.58;
const GAP = 3;
const XR_LOG = [2.4, 4.8];
const YR = [0, 18];
const PW = 1040;   // 1350 - 80 - 230 (wider right margin)
const PH = 805;    // 950 - 65 - 80
const XR_SPAN = XR_LOG[1] - XR_LOG[0];

function pxX(v) { return (Math.log10(v) - XR_LOG[0]) / XR_SPAN * PW; }
function pxY(v) { return (YR[1] - v) / (YR[1] - YR[0]) * PH; }

function labelBox(d, pos) {
  const hw = d._tw / 2;
  switch (pos) {
    case 'top center':
      return { l: d._px - hw, r: d._px + hw, t: d._py - d._mr - GAP - TEXT_H, b: d._py - d._mr - GAP };
    case 'bottom center':
      return { l: d._px - hw, r: d._px + hw, t: d._py + d._mr + GAP, b: d._py + d._mr + GAP + TEXT_H };
    case 'right center':
      return { l: d._px + d._mr + GAP, r: d._px + d._mr + GAP + d._tw, t: d._py - TEXT_H / 2, b: d._py + TEXT_H / 2 };
    case 'left center':
      return { l: d._px - d._mr - GAP - d._tw, r: d._px - d._mr - GAP, t: d._py - TEXT_H / 2, b: d._py + TEXT_H / 2 };
  }
}
function circleBox(d) { return { l: d._px - d._mr, r: d._px + d._mr, t: d._py - d._mr, b: d._py + d._mr }; }
function overlap(a, b) { return a.r > b.l && b.r > a.l && a.b > b.t && b.b > a.t; }

DATA.forEach(d => {
  d._px = pxX(d.tok);
  d._py = pxY(d.y);
  d._mr = d.sz / SIZEREF / 2;
  const stat = `${d.tok.toLocaleString()} tok · ${(d.tok/2000).toFixed(1)}%`;
  d.label = `${d.s}<br>${stat}`;
  d._tw = Math.max(d.s.length, stat.length) * CW;
  d._th = TEXT_H;
  d._pos = 'top center';
});

function tryPositions(d, items, order) {
  for (const pos of order) {
    const box = labelBox(d, pos);
    // off-chart check
    if (box.l < 0 || box.r > PW) continue;
    // label-vs-label overlap with other items' final positions
    let ok = true;
    for (const b of items) {
      if (b === d) continue;
      const bBox = labelBox(b, b._pos);
      if (overlap(box, bBox)) { ok = false; break; }
    }
    // label-vs-circle overlap
    if (ok) {
      for (const b of items) {
        if (b === d) continue;
        const cb = circleBox(b);
        if (overlap(box, cb)) { ok = false; break; }
      }
    }
    if (ok) { d._pos = pos; return true; }
  }
  return false;
}

CATS.forEach(cat => {
  const items = DATA.filter(d => d.c === cat);
  items.sort((a, b) => a._px - b._px);

  // Pass 1: flip overlapping adjacent top labels to bottom
  for (let i = 0; i < items.length; i++) {
    for (let j = i + 1; j < items.length; j++) {
      const a = items[i], b = items[j];
      if (a._pos !== 'top center' || b._pos !== 'top center') continue;
      if (overlap(labelBox(a, 'top center'), labelBox(b, 'top center'))) {
        if (a._py > b._py) a._pos = 'bottom center';
        else               b._pos = 'bottom center';
      }
    }
  }

  // Pass 2: fix any bottom label that collides below; try right/left as fallback
  const TRIAL = ['right center', 'left center', 'top center'];
  for (const a of items) {
    if (a._pos !== 'bottom center') continue;
    // Check if bottom label goes below plot area
    const botBox = labelBox(a, 'bottom center');
    const hitsBottom = botBox.b > PH;
    // Check if bottom label hits a circle below
    let hitsCircle = false;
    for (const b of items) {
      if (b === a || b._py <= a._py) continue;
      if (overlap(botBox, circleBox(b))) { hitsCircle = true; break; }
    }
    if (hitsBottom || hitsCircle) {
      // Reset to top, then try better positions
      a._pos = 'top center';
      tryPositions(a, items, TRIAL);
    }
  }
});
// ── Manual label position overrides ──
const forcedPos = {
  'Google Calendar': 'right center',
  'Gmail':           'top center',
  'Grep':            'left center',
  'Serena':          'right center',
};
DATA.forEach(d => {
  if (forcedPos[d.s]) d._pos = forcedPos[d.s];
});

// ── Main category traces ──
const traces = CATS.map(cat => {
  const items = DATA.filter(d => d.c === cat);
  return {
    x:           items.map(d => d.tok),
    y:           items.map(d => d.y),
    text:        items.map(d => d.label),
    textposition: items.map(d => d._pos),
    mode:        'markers+text',
    name:        cat,
    textfont:    { color: '#1e293b', size: FONT_SZ },
    hoverinfo:   'skip',
    marker: {
      size:      items.map(d => d.sz),
      sizeref:   SIZEREF,
      sizemode:  'diameter',
      color:     COLORS[cat],
      line:      { color: 'rgba(255,255,255,0.5)', width: 1 },
    },
  };
});

// ── Size reference annotations (below legend, left-aligned) ──
const sizeRefs = [200, 500, 2000, 5000];
const sizeAnnos = [
  // Separator below legend
  {
    x: 1.02, y: 0.66,
    xref: 'paper', yref: 'paper',
    xanchor: 'left', yanchor: 'top',
    showarrow: false,
    text: '────────────────',
    font: { size: 10, color: '#cbd5e1' },
  },
  // Title
  {
    x: 1.02, y: 0.635,
    xref: 'paper', yref: 'paper',
    xanchor: 'left', yanchor: 'top',
    showarrow: false,
    text: '<b>Avg Tokens per Tool</b>',
    font: { size: 11, color: '#475569' },
  },
  ...sizeRefs.flatMap((v, i) => {
    const baseY = 0.59 - i * 0.085;
    const dotSz = v ** 0.33 * 4.5;
    return [
      {
        x: 1.02, y: baseY,
        xref: 'paper', yref: 'paper',
        xanchor: 'center', yanchor: 'middle',
        showarrow: false,
        text: '●',
        font: { size: dotSz, color: '#94a3b8' },
      },
      {
        x: 1.045, y: baseY,
        xref: 'paper', yref: 'paper',
        xanchor: 'left', yanchor: 'middle',
        showarrow: false,
        text: `${v.toLocaleString()} · ${(v/2000).toFixed(1)}%`,
        font: { size: 11, color: '#64748b' },
      },
    ];
  }),
];

const layout = {
  title: {
    text: 'MCP Server Token Cost<br><span style="font-size:12px;color:#64748b;font-weight:400">Circle size ∝ avg tokens per tool (log). Labels show total tokens and % of Sonnet 4.5 200K window.</span>',
    font: { size: 20, color: '#0f172a' },
    x: 0.5,
  },
  xaxis: {
    title: { text: 'Total Tokens (log scale) &nbsp;→&nbsp; % of Sonnet 4.5 200K window', font: { color: '#475569', size: 12 } },
    type: 'log',
    range: XR_LOG,
    gridcolor:  '#e2e8f0',
    zerolinecolor: '#cbd5e1',
    tickfont: { color: '#64748b' },
    tickformat: ',.0f',
    separatethousands: true,
  },
  yaxis: {
    showticklabels: false,
    range: YR,
    gridcolor:  '#e2e8f0',
    zeroline:   false,
  },
  plot_bgcolor:  '#f8fafc',
  paper_bgcolor: '#ffffff',
  font: { color: '#334155' },
  showlegend: true,
  legend: {
    font: { size: 12, color: '#334155' },
    bgcolor:  'rgba(255,255,255,0.9)',
    bordercolor: '#e2e8f0',
    x: 1.02,
    y: 0.96,
    yanchor: 'top',
  },
  margin: { l: 60, r: 230, t: 65, b: 80 },
  annotations: sizeAnnos,
};

Plotly.newPlot('chart', traces, layout, {
  responsive: true,
  displayModeBar: false,
});
</script>
</body>
</html>
